name: Mutation testing

on:
  schedule:
    - cron: "0 5 * * *"  # nightly @ 05:00 UTC
  workflow_dispatch:

permissions: {}

jobs:
  mutate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Mutate protocol package (≥90% kill rate required)
        run: |
          # mutmut returns non-zero when any mutant survived/timed-out; suppress
          # so we can run the gate parser ourselves.
          mutmut run --paths-to-mutate src/jkbms2mqtt/protocol/ || true
          mutmut junitxml > mutmut-protocol.xml
          python scripts/check_kill_rate.py mutmut-protocol.xml --min 0.90 --label protocol

      - name: Mutate entities (≥80% kill rate)
        run: |
          rm -rf .mutmut-cache
          mutmut run --paths-to-mutate src/jkbms2mqtt/entities.py || true
          mutmut junitxml > mutmut-entities.xml
          python scripts/check_kill_rate.py mutmut-entities.xml --min 0.80 --label entities
