name: Mutation testing

on:
  schedule:
    - cron: "0 5 * * *"  # nightly @ 05:00 UTC
  workflow_dispatch:

jobs:
  mutate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Mutate protocol package (≥90% kill rate required)
        run: |
          mutmut run --paths-to-mutate src/jkbms2mqtt/protocol/ || true
          # mutmut returns non-zero if mutants survived; we want a percentage gate.
          python - <<'PY'
          import json
          import subprocess
          result = subprocess.check_output(["mutmut", "results"]).decode()
          # mutmut 3.x summary: parse killed / surviving / total
          killed = result.count("killed")
          survived = result.count("survived")
          total = killed + survived
          ratio = killed / total if total else 1.0
          print(f"protocol mutants: killed={killed} survived={survived} ratio={ratio:.1%}")
          assert ratio >= 0.90, f"kill ratio {ratio:.1%} < 90% on protocol"
          PY

      - name: Mutate entities (≥80% kill rate)
        run: |
          rm -rf .mutmut-cache
          mutmut run --paths-to-mutate src/jkbms2mqtt/entities.py || true
          python - <<'PY'
          import subprocess
          result = subprocess.check_output(["mutmut", "results"]).decode()
          killed = result.count("killed")
          survived = result.count("survived")
          total = killed + survived
          ratio = killed / total if total else 1.0
          print(f"entities mutants: killed={killed} survived={survived} ratio={ratio:.1%}")
          assert ratio >= 0.80, f"kill ratio {ratio:.1%} < 80% on entities"
          PY
