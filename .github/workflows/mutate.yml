name: Mutation testing

on:
  schedule:
    - cron: "0 5 * * *"  # nightly @ 05:00 UTC
  workflow_dispatch:

permissions: {}

defaults:
  run:
    working-directory: jkbms2mqtt

jobs:
  mutate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jkbms2mqtt/pyproject.toml
      - run: pip install -e ".[dev]"

      # One mutmut run mutates both packages (paths_to_mutate in pyproject.toml);
      # the per-package gates below split the results by mutant-name prefix.
      - name: Run mutation testing
        run: |
          # mutmut returns non-zero when any mutant survives; suppress so we can
          # run the gate parsers ourselves.
          mutmut run || true
          mutmut results --all true > mutmut-results.txt

      - name: Gate protocol package (≥90% kill rate required)
        run: |
          python scripts/check_kill_rate.py mutmut-results.txt \
            --min 0.90 --select .protocol. --label protocol --show-survivors

      - name: Gate entities (≥80% kill rate required)
        run: |
          python scripts/check_kill_rate.py mutmut-results.txt \
            --min 0.80 --select .entities. --label entities --show-survivors
