name: CI

on:
  push:
    branches: [main]
  pull_request:

# Default to the most restrictive permissions; each job opts into what it needs.
permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# All Python tooling runs from the add-on subdir, where pyproject.toml lives.
defaults:
  run:
    working-directory: jkbms2mqtt

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jkbms2mqtt/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: mypy src

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jkbms2mqtt/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Run tests with 100% branch coverage gate
        run: pytest --cov --cov-branch --cov-report=term --cov-fail-under=100

  dashboards:
    # Lint the dashboard generator, assert the committed artifacts are in sync
    # with it, and assert the dashboard references exactly the entities the
    # bridge publishes — so entity drift fails the build.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # generate.py / check_entities.py live at the repo root, not the add-on subdir.
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jkbms2mqtt/pyproject.toml
      # Editable install makes jkbms2mqtt.entities importable (the source of
      # truth for the drift check) and provides ruff; PyYAML drives the generator.
      - run: pip install -e ./jkbms2mqtt[dev] pyyaml
      - name: Lint generator + checker
        run: ruff check --config jkbms2mqtt/pyproject.toml dashboards/generate.py dashboards/check_entities.py
      - name: Assert committed dashboard artifacts are in sync with the generator
        run: |
          python dashboards/generate.py --bms-ids 1,2,3,4,5,6 --cells 16
          git diff --exit-code dashboards/out dashboards/packages
      - name: Assert dashboard entities match the bridge's entity table
        run: python dashboards/check_entities.py

  docker-build:
    # Validate the supervisor's local-build path on every PR by building the
    # add-on Dockerfile the same way HA does. Never pushes — no creds needed.
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: read
    # build-push-action needs a non-subdir working-directory.
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: jkbms2mqtt
          platforms: linux/amd64,linux/arm64
          push: false
