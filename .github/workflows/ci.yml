name: CI

on:
  push:
    branches: [main]
  pull_request:

# Default to the most restrictive permissions; each job opts into what it needs.
permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# All Python tooling runs from the add-on subdir, where pyproject.toml lives.
defaults:
  run:
    working-directory: jkbms2mqtt

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jkbms2mqtt/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: mypy src

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jkbms2mqtt/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Run tests with 100% branch coverage gate
        run: pytest --cov --cov-branch --cov-report=term --cov-fail-under=100

  docker-build:
    # Validate the supervisor's local-build path on every PR by building the
    # add-on Dockerfile the same way HA does. Never pushes — no creds needed.
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: read
    # build-push-action needs a non-subdir working-directory.
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: jkbms2mqtt
          platforms: linux/amd64,linux/arm64
          push: false
