name: CI

on:
  push:
    branches: [main]
  pull_request:

# Default to the most restrictive permissions; each job opts into what it needs.
permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: mypy src

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Run tests with 100% branch coverage gate
        run: |
          # Bare --cov picks up `[tool.coverage.run] source = ["src/jkbms2mqtt"]`
          # from pyproject.toml. Don't pass `--cov=jkbms2mqtt` — at the repo root
          # that name resolves to the HA add-on directory, not the Python package.
          pytest --cov --cov-branch --cov-report=term --cov-fail-under=100

  docker-build:
    # On PRs: confirm the image builds (no push, no creds needed).
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Minimum permissions for GHCR publish.
    permissions:
      contents: read
      packages: write
    # Serialise pushes to `:latest` so two simultaneous main merges can't race.
    concurrency:
      group: docker-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract add-on version
        id: addon
        run: |
          version=$(grep -E '^version:' jkbms2mqtt/config.yaml | sed -E 's/version: *"?([^"]*)"?/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          # HA supervisor supports aarch64 and amd64; armv7 is deprecated.
          platforms: linux/amd64,linux/arm64
          push: true
          # HA composes <image>:<addon-version> at install time, so we MUST
          # publish the version tag in addition to latest/sha.
          tags: |
            ghcr.io/${{ github.repository_owner }}/jkbms2mqtt:latest
            ghcr.io/${{ github.repository_owner }}/jkbms2mqtt:${{ steps.addon.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/jkbms2mqtt:${{ github.sha }}
