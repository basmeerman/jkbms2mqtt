# naming: legacy  bms-ids: 1,2,3,4,5,6  cells: 1=16,2=16,3=16,4=16,5=16,6=16
template:
- binary_sensor:
  - name: JKBMS Any Alarm
    unique_id: jkbms_any_alarm
    device_class: problem
    state: |
      {% set ns = namespace(active=false) %}
      {% for e in ['sensor.bms_1_comma_separated_list_of_active_alarms', 'sensor.bms_2_comma_separated_list_of_active_alarms', 'sensor.bms_3_comma_separated_list_of_active_alarms', 'sensor.bms_4_comma_separated_list_of_active_alarms', 'sensor.bms_5_comma_separated_list_of_active_alarms', 'sensor.bms_6_comma_separated_list_of_active_alarms'] %}
        {% if states(e) not in ['', 'unknown', 'unavailable', 'none', 'None'] %}{% set ns.active = true %}{% endif %}
      {% endfor %}
      {{ ns.active }}
    attributes:
      bms: |
        {% set ns = namespace(items=[]) %}
        {% for p in [[1, 'sensor.bms_1_comma_separated_list_of_active_alarms'], [2, 'sensor.bms_2_comma_separated_list_of_active_alarms'], [3, 'sensor.bms_3_comma_separated_list_of_active_alarms'], [4, 'sensor.bms_4_comma_separated_list_of_active_alarms'], [5, 'sensor.bms_5_comma_separated_list_of_active_alarms'], [6, 'sensor.bms_6_comma_separated_list_of_active_alarms']] %}
          {% if states(p[1]) not in ['', 'unknown', 'unavailable', 'none', 'None'] %}{% set ns.items = ns.items + ['BMS ' ~ p[0]] %}{% endif %}
        {% endfor %}
        {{ ns.items | join(', ') if ns.items | length > 0 else 'None' }}
  sensor:
  - name: JKBMS Bank Total Power
    unique_id: jkbms_bank_total_power_w
    unit_of_measurement: W
    device_class: power
    state: |
      {% set ns = namespace(vals=[]) %}
      {% for e in ['sensor.bms_1_total_pack_power_signed', 'sensor.bms_2_total_pack_power_signed', 'sensor.bms_3_total_pack_power_signed', 'sensor.bms_4_total_pack_power_signed', 'sensor.bms_5_total_pack_power_signed', 'sensor.bms_6_total_pack_power_signed'] %}
        {% if states(e) not in ['', 'unknown', 'unavailable'] %}{% set ns.vals = ns.vals + [states(e) | float(0)] %}{% endif %}
      {% endfor %}
      {{ (ns.vals | sum | round(1)) if ns.vals | length > 0 else 'unknown' }}
  - name: JKBMS Bank Total Current
    unique_id: jkbms_bank_total_current_a
    unit_of_measurement: A
    device_class: current
    state: |
      {% set ns = namespace(vals=[]) %}
      {% for e in ['sensor.bms_1_total_pack_current_negative_discharge', 'sensor.bms_2_total_pack_current_negative_discharge', 'sensor.bms_3_total_pack_current_negative_discharge', 'sensor.bms_4_total_pack_current_negative_discharge', 'sensor.bms_5_total_pack_current_negative_discharge', 'sensor.bms_6_total_pack_current_negative_discharge'] %}
        {% if states(e) not in ['', 'unknown', 'unavailable'] %}{% set ns.vals = ns.vals + [states(e) | float(0)] %}{% endif %}
