    attributes:
      bms: |
        {% set ns = namespace(best=None, bms='unknown') %}
        {% for p in [[1, 'sensor.bms_1_mosfet_temperature'], [2, 'sensor.bms_2_mosfet_temperature'], [3, 'sensor.bms_3_mosfet_temperature'], [4, 'sensor.bms_4_mosfet_temperature'], [5, 'sensor.bms_5_mosfet_temperature'], [6, 'sensor.bms_6_mosfet_temperature']] %}
          {% set v = states(p[1]) %}
          {% if v not in ['', 'unknown', 'unavailable'] %}
            {% set f = v | float(0) %}
            {% if ns.best is none or f > ns.best %}{% set ns.best = f %}{% set ns.bms = 'BMS ' ~ p[0] %}{% endif %}
          {% endif %}
        {% endfor %}
        {{ ns.bms }}
