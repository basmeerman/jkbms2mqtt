      {{ (ns.vals | sum | round(2)) if ns.vals | length > 0 else 'unknown' }}
  - name: JKBMS Bank Min SoC
    unique_id: jkbms_bank_min_soc
    unit_of_measurement: '%'
    device_class: battery
    state: |
      {% set ns = namespace(vals=[]) %}
      {% for e in ['sensor.bms_1_state_of_charge', 'sensor.bms_2_state_of_charge', 'sensor.bms_3_state_of_charge', 'sensor.bms_4_state_of_charge', 'sensor.bms_5_state_of_charge', 'sensor.bms_6_state_of_charge'] %}
        {% if states(e) not in ['', 'unknown', 'unavailable'] %}{% set ns.vals = ns.vals + [states(e) | float(0)] %}{% endif %}
      {% endfor %}
      {{ (ns.vals | min) if ns.vals | length > 0 else 'unknown' }}
    attributes:
      bms: |
        {% set ns = namespace(best=None, bms='unknown') %}
        {% for p in [[1, 'sensor.bms_1_state_of_charge'], [2, 'sensor.bms_2_state_of_charge'], [3, 'sensor.bms_3_state_of_charge'], [4, 'sensor.bms_4_state_of_charge'], [5, 'sensor.bms_5_state_of_charge'], [6, 'sensor.bms_6_state_of_charge']] %}
          {% set v = states(p[1]) %}
          {% if v not in ['', 'unknown', 'unavailable'] %}
            {% set f = v | float(0) %}
            {% if ns.best is none or f < ns.best %}{% set ns.best = f %}{% set ns.bms = 'BMS ' ~ p[0] %}{% endif %}
          {% endif %}
        {% endfor %}
        {{ ns.bms }}
  - name: JKBMS Bank Max Temp
