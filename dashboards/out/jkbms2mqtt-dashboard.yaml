- title: BMS 1
  path: bms-1
  subview: true
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Live
      heading_style: title
      icon: mdi:flash
    - type: custom:entity-progress-card
      entity: sensor.bms_1_state_of_charge
      name: State of charge
      max_value: 100
    - type: grid
      columns: 3
      square: false
      cards:
      - type: gauge
        entity: sensor.bms_1_total_pack_voltage
        name: Voltage
        min: 40
        max: 60
        needle: true
      - type: gauge
        entity: sensor.bms_1_total_pack_power_signed
        name: Power
        min: -11000
        max: 11000
        needle: true
      - type: gauge
        entity: sensor.bms_1_total_pack_current_negative_discharge
        name: Current
        min: -200
        max: 200
        needle: true
    - type: grid
      columns: 2
      square: false
      cards:
      - type: custom:mushroom-template-card
        primary: Charge
        secondary: '{% if is_state(''binary_sensor.bms_1_charge_mosfet_state_reported'',''on'') %}On{%
          elif is_state(''binary_sensor.bms_1_charge_mosfet_state_reported'',''off'') %}Off{% else %}Unknown{%
          endif %}'
        icon: '{% if is_state(''binary_sensor.bms_1_charge_mosfet_state_reported'',''on'') %}mdi:toggle-switch{%
