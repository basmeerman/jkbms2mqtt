- title: BMS 4
  path: bms-4
  subview: true
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Live
      heading_style: title
      icon: mdi:flash
    - type: custom:mushroom-template-card
      primary: Last seen
      secondary: '{% if states(''sensor.bms_4_last_seen'') in ['''', ''unknown'', ''unavailable''] %}Never{%
        else %}{{ relative_time(as_datetime(states(''sensor.bms_4_last_seen''))) }} ago{% endif %}'
      icon: mdi:access-point-network
      icon_color: '{% if states(''sensor.bms_4_last_seen'') in ['''', ''unknown'', ''unavailable''] %}#9e9e9e{%
        else %}{% set f = ((now() - as_datetime(states(''sensor.bms_4_last_seen''))).total_seconds() /
        300) %}{% set f = [[f, 0] | max, 1] | min %}{{ ''#%02x%02x%02x'' | format((65 + (158 - 65) * f)
        | round | int, (205 + (158 - 205) * f) | round | int, (82 + (158 - 82) * f) | round | int) }}{%
        endif %}'
      entity: sensor.bms_4_last_seen
      tap_action:
        action: more-info
    - type: entities
      entities:
      - entity: sensor.bms_4_last_seen
        name: Last successful poll
        format: datetime
    - type: custom:entity-progress-card
      entity: sensor.bms_4_state_of_charge
      name: State of charge
      max_value: 100
    - type: grid
      columns: 3
      square: false
      cards:
      - type: gauge
        entity: sensor.bms_4_total_voltage
        name: Voltage
        min: 40
        max: 60
        needle: true
      - type: gauge
        entity: sensor.bms_4_total_power
        name: Power
        min: -11000
        max: 11000
        needle: true
      - type: gauge
        entity: sensor.bms_4_total_current
        name: Current
        min: -200
        max: 200
        needle: true
    - type: grid
      columns: 2
      square: false
      cards:
      - type: custom:mushroom-template-card
        primary: Charge
        secondary: '{% if is_state(''binary_sensor.bms_4_charge_mosfet_state'',''on'') %}On{% elif is_state(''binary_sensor.bms_4_charge_mosfet_state'',''off'')
          %}Off{% else %}Unknown{% endif %}'
        icon: '{% if is_state(''binary_sensor.bms_4_charge_mosfet_state'',''on'') %}mdi:toggle-switch{%
          elif is_state(''binary_sensor.bms_4_charge_mosfet_state'',''off'') %}mdi:toggle-switch-off{%
          else %}mdi:help-circle{% endif %}'
        icon_color: '{% if is_state(''binary_sensor.bms_4_charge_mosfet_state'',''on'') %}green{% elif
          is_state(''binary_sensor.bms_4_charge_mosfet_state'',''off'') %}red{% else %}grey{% endif %}'
        entity: binary_sensor.bms_4_charge_mosfet_state
        tap_action:
          action: more-info
      - type: custom:mushroom-template-card
        primary: Discharge
        secondary: '{% if is_state(''binary_sensor.bms_4_discharge_mosfet_state'',''on'') %}On{% elif
          is_state(''binary_sensor.bms_4_discharge_mosfet_state'',''off'') %}Off{% else %}Unknown{% endif
          %}'
        icon: '{% if is_state(''binary_sensor.bms_4_discharge_mosfet_state'',''on'') %}mdi:toggle-switch{%
          elif is_state(''binary_sensor.bms_4_discharge_mosfet_state'',''off'') %}mdi:toggle-switch-off{%
          else %}mdi:help-circle{% endif %}'
        icon_color: '{% if is_state(''binary_sensor.bms_4_discharge_mosfet_state'',''on'') %}green{% elif
          is_state(''binary_sensor.bms_4_discharge_mosfet_state'',''off'') %}red{% else %}grey{% endif
          %}'
        entity: binary_sensor.bms_4_discharge_mosfet_state
        tap_action:
          action: more-info
      - type: custom:mushroom-template-card
        primary: Balance
        secondary: '{% if is_state(''binary_sensor.bms_4_balancing_state'',''on'') %}On{% elif is_state(''binary_sensor.bms_4_balancing_state'',''off'')
          %}Off{% else %}Unknown{% endif %}'
        icon: '{% if is_state(''binary_sensor.bms_4_balancing_state'',''on'') %}mdi:toggle-switch{% elif
          is_state(''binary_sensor.bms_4_balancing_state'',''off'') %}mdi:toggle-switch-off{% else %}mdi:help-circle{%
          endif %}'
        icon_color: '{% if is_state(''binary_sensor.bms_4_balancing_state'',''on'') %}green{% elif is_state(''binary_sensor.bms_4_balancing_state'',''off'')
          %}red{% else %}grey{% endif %}'
