          is_state(''binary_sensor.bms_2_balancing_state'',''off'') %}mdi:toggle-switch-off{% else %}mdi:help-circle{%
          endif %}'
        icon_color: '{% if is_state(''binary_sensor.bms_2_balancing_state'',''on'') %}green{% elif is_state(''binary_sensor.bms_2_balancing_state'',''off'')
