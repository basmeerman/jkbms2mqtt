          icon_color: '{% if states(''sensor.bms_1_alarms'') in ['''', ''unknown'', ''unavailable'', ''none'',
            ''None''] %}green{% else %}red{% endif %}'
          entity: sensor.bms_1_alarms
          tap_action:
            action: more-info
    column_span: 1
