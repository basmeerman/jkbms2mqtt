        name: Serial number
  - type: grid
    cards:
    - type: heading
      heading: Controls
      heading_style: title
      icon: mdi:tune
    - type: markdown
      content: |
        **Settings always show the BMS's current value.** The write tiers decide
        whether they can be changed from Home Assistant:

        - Basic settings: read-only (set `enable_basic_writes: true` to edit)
        - Safety thresholds: read-only (set `enable_safety_writes: true` to edit)

        The add-on rebuilds this dashboard when it restarts; a manually installed
        copy must be regenerated after changing a tier.

        ⚠️ Safety thresholds can damage cells or cause a fire if set wrong.
    - type: entities
      title: Basic settings
      entities:
      - entity: binary_sensor.bms_6_enable_disable_the_charge_mosfet
        name: Charging switch
      - entity: binary_sensor.bms_6_enable_disable_the_discharge_mosfet
        name: Discharging switch
      - entity: binary_sensor.bms_6_enable_disable_active_cell_balancing
        name: Balance switch
      - entity: sensor.bms_6_cell_voltage_below_which_the_bms_enters_smart_sleep
        name: Smart-sleep voltage
      - entity: sensor.bms_6_cell_delta_voltage_at_which_balancing_kicks_in
        name: Balance trigger voltage
      - entity: sensor.bms_6_minimum_cell_voltage_before_balancing_is_enabled
        name: Balance starting voltage
      - entity: sensor.bms_6_maximum_balance_current_hardware_capped_at_10_a
        name: Max balance current
      - entity: sensor.bms_6_cell_voltage_that_represents_100_soc_display_only
        name: Cell voltage @ 100% SoC
      - entity: sensor.bms_6_cell_voltage_that_represents_0_soc_display_only
        name: Cell voltage @ 0% SoC
      - entity: sensor.bms_6_cell_voltage_the_bms_requests_from_the_charger
        name: Cell request-charge voltage
      - entity: sensor.bms_6_cell_float_voltage_the_bms_requests_from_the_charger
        name: Cell request-float voltage
    - type: entities
      title: Safety thresholds
      entities:
      - entity: sensor.bms_6_under_voltage_protection_threshold
        name: Cell UVP
      - entity: sensor.bms_6_uvp_recovery_threshold_must_be_above_uvp
        name: Cell UVP recovery
      - entity: sensor.bms_6_over_voltage_protection_threshold_set_too_high_fire_risk
        name: Cell OVP
      - entity: sensor.bms_6_ovp_recovery_threshold_must_be_below_ovp
        name: Cell OVP recovery
      - entity: sensor.bms_6_cell_voltage_at_which_the_bms_powers_off_battery_preservation
        name: Power-off voltage
      - entity: sensor.bms_6_maximum_charge_current
        name: Max charge current
      - entity: sensor.bms_6_delay_before_charge_over_current_protection_trips
        name: Charge OCP delay
      - entity: sensor.bms_6_time_before_charge_ocp_can_be_cleared
        name: Charge OCP recovery time
      - entity: sensor.bms_6_maximum_discharge_current
        name: Max discharge current
      - entity: sensor.bms_6_delay_before_discharge_over_current_protection_trips
        name: Discharge OCP delay
      - entity: sensor.bms_6_time_before_discharge_ocp_can_be_cleared
        name: Discharge OCP recovery time
      - entity: sensor.bms_6_short_circuit_protection_trip_delay
        name: Short-circuit protection delay (µs)
      - entity: sensor.bms_6_time_before_short_circuit_protection_can_be_cleared
        name: Short-circuit protection recovery time
      - entity: sensor.bms_6_discharge_over_temperature_protection
        name: Discharge OTP
      - entity: sensor.bms_6_discharge_otp_recovery_threshold
        name: Discharge OTP recovery
      - entity: sensor.bms_6_charge_over_temperature_protection
        name: Charge OTP
      - entity: sensor.bms_6_charge_otp_recovery_threshold
        name: Charge OTP recovery
      - entity: sensor.bms_6_charge_under_temperature_protection_lithium_plating_risk
        name: Charge UTP
      - entity: sensor.bms_6_charge_utp_recovery_threshold
        name: Charge UTP recovery
      - entity: sensor.bms_6_mosfet_over_temperature_protection
        name: MOSFET OTP
      - entity: sensor.bms_6_mosfet_otp_recovery_threshold
        name: MOSFET OTP recovery
      - entity: sensor.bms_6_number_of_cells_in_the_pack
        name: Cell count
      - entity: sensor.bms_6_configured_pack_capacity_drives_soc_scaling
        name: Pack capacity setting
