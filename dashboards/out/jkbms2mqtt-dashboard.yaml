- title: BMS 5
  path: bms-5
  subview: true
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Live
      heading_style: title
      icon: mdi:flash
    - type: custom:entity-progress-card
      entity: sensor.bms_5_state_of_charge
      name: State of charge
      max_value: 100
    - type: grid
      columns: 3
      square: false
      cards:
      - type: gauge
        entity: sensor.bms_5_total_pack_voltage
        name: Voltage
        min: 40
        max: 60
        needle: true
      - type: gauge
        entity: sensor.bms_5_total_pack_power_signed
        name: Power
        min: -11000
        max: 11000
        needle: true
      - type: gauge
        entity: sensor.bms_5_total_pack_current_negative_discharge
        name: Current
        min: -200
        max: 200
        needle: true
    - type: grid
      columns: 2
      square: false
      cards:
      - type: custom:mushroom-template-card
        primary: Charge
        secondary: '{% if is_state(''binary_sensor.bms_5_charge_mosfet_state_reported'',''on'') %}On{%
          elif is_state(''binary_sensor.bms_5_charge_mosfet_state_reported'',''off'') %}Off{% else %}Unknown{%
          endif %}'
        icon: '{% if is_state(''binary_sensor.bms_5_charge_mosfet_state_reported'',''on'') %}mdi:toggle-switch{%
          elif is_state(''binary_sensor.bms_5_charge_mosfet_state_reported'',''off'') %}mdi:toggle-switch-off{%
          else %}mdi:help-circle{% endif %}'
        icon_color: '{% if is_state(''binary_sensor.bms_5_charge_mosfet_state_reported'',''on'') %}green{%
          elif is_state(''binary_sensor.bms_5_charge_mosfet_state_reported'',''off'') %}red{% else %}grey{%
          endif %}'
        entity: binary_sensor.bms_5_charge_mosfet_state_reported
        tap_action:
          action: more-info
      - type: custom:mushroom-template-card
        primary: Discharge
        secondary: '{% if is_state(''binary_sensor.bms_5_discharge_mosfet_state_reported'',''on'') %}On{%
          elif is_state(''binary_sensor.bms_5_discharge_mosfet_state_reported'',''off'') %}Off{% else
          %}Unknown{% endif %}'
        icon: '{% if is_state(''binary_sensor.bms_5_discharge_mosfet_state_reported'',''on'') %}mdi:toggle-switch{%
          elif is_state(''binary_sensor.bms_5_discharge_mosfet_state_reported'',''off'') %}mdi:toggle-switch-off{%
          else %}mdi:help-circle{% endif %}'
        icon_color: '{% if is_state(''binary_sensor.bms_5_discharge_mosfet_state_reported'',''on'') %}green{%
          elif is_state(''binary_sensor.bms_5_discharge_mosfet_state_reported'',''off'') %}red{% else
          %}grey{% endif %}'
        entity: binary_sensor.bms_5_discharge_mosfet_state_reported
        tap_action:
          action: more-info
      - type: custom:mushroom-template-card
        primary: Balance
        secondary: '{% if is_state(''binary_sensor.bms_5_balance_state_reported'',''on'') %}On{% elif
          is_state(''binary_sensor.bms_5_balance_state_reported'',''off'') %}Off{% else %}Unknown{% endif
          %}'
        icon: '{% if is_state(''binary_sensor.bms_5_balance_state_reported'',''on'') %}mdi:toggle-switch{%
          elif is_state(''binary_sensor.bms_5_balance_state_reported'',''off'') %}mdi:toggle-switch-off{%
          else %}mdi:help-circle{% endif %}'
        icon_color: '{% if is_state(''binary_sensor.bms_5_balance_state_reported'',''on'') %}green{% elif
          is_state(''binary_sensor.bms_5_balance_state_reported'',''off'') %}red{% else %}grey{% endif
          %}'
        entity: binary_sensor.bms_5_balance_state_reported
        tap_action:
          action: more-info
      - type: custom:mushroom-template-card
        primary: Balance current
        secondary: '{{ states(''sensor.bms_5_cell_balance_current'') }} A'
        icon: '{% set c = states(''sensor.bms_5_cell_balance_current'') | float(0) %}{% if c > 0 %}mdi:arrow-up-bold{%
          elif c < 0 %}mdi:arrow-down-bold{% else %}mdi:arrow-right-bold{% endif %}'
        icon_color: '{% set c = states(''sensor.bms_5_cell_balance_current'') | float(0) %}{% if c > 0
          %}green{% elif c < 0 %}red{% else %}blue{% endif %}'
        entity: sensor.bms_5_cell_balance_current
        tap_action:
          action: more-info
    - type: grid
      columns: 3
      square: false
      cards:
      - type: custom:mushroom-entity-card
        entity: sensor.bms_5_mosfet_temperature
        name: MOS
        tap_action:
          action: more-info
        icon: mdi:thermometer
