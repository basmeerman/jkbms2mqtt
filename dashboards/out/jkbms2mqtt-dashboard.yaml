            action: more-info
          icon: mdi:battery-heart-outline
        - type: custom:mushroom-template-card
          primary: Alarms
          secondary: '{% if states(''sensor.bms_1_alarms'') in ['''', ''unknown'', ''unavailable'', ''none'',
            ''None''] %}None{% else %}{{ states(''sensor.bms_1_alarms'') }}{% endif %}'
          icon: '{% if states(''sensor.bms_1_alarms'') in ['''', ''unknown'', ''unavailable'', ''none'',
