        secondary: '{% if is_state(''binary_sensor.bms_2_discharge_mosfet_state'',''on'') %}On{% elif
          is_state(''binary_sensor.bms_2_discharge_mosfet_state'',''off'') %}Off{% else %}Unknown{% endif
