      columns: 5
      square: false
      cards:
      - type: custom:mushroom-template-card
        primary: '{{ states(''sensor.jkbms_bank_total_power'') }} W'
        secondary: Total power
        icon: mdi:flash
        icon_color: amber
        entity: sensor.jkbms_bank_total_power
        tap_action:
          action: more-info
      - type: custom:mushroom-template-card
        primary: '{{ states(''sensor.jkbms_bank_total_current'') }} A'
        secondary: Total current
        icon: mdi:current-dc
        icon_color: light-blue
        entity: sensor.jkbms_bank_total_current
        tap_action:
          action: more-info
      - type: custom:mushroom-template-card
        primary: '{{ states(''sensor.jkbms_bank_max_temp'') }} °C'
        secondary: Max temp ({{ state_attr('sensor.jkbms_bank_max_temp', 'bms') }})
        icon: mdi:thermometer
        icon_color: deep-orange
        entity: sensor.jkbms_bank_max_temp
        tap_action:
          action: more-info
      - type: custom:mushroom-template-card
        primary: '{{ states(''sensor.jkbms_bank_min_soc'') }} %'
        secondary: Min SoC ({{ state_attr('sensor.jkbms_bank_min_soc', 'bms') }})
        icon: mdi:battery-low
        icon_color: green
        entity: sensor.jkbms_bank_min_soc
        tap_action:
          action: more-info
      - type: custom:mushroom-template-card
        primary: '{% if is_state(''binary_sensor.jkbms_any_alarm'', ''on'') %}Alarm{% else %}OK{% endif
          %}'
        secondary: Alarms ({{ state_attr('binary_sensor.jkbms_any_alarm', 'bms') }})
        icon: '{% if is_state(''binary_sensor.jkbms_any_alarm'', ''on'') %}mdi:alert{% else %}mdi:shield-check{%
          endif %}'
        icon_color: '{% if is_state(''binary_sensor.jkbms_any_alarm'', ''on'') %}red{% else %}green{%
          endif %}'
        entity: binary_sensor.jkbms_any_alarm
        tap_action:
          action: more-info
  - type: grid
    cards:
    - type: vertical-stack
