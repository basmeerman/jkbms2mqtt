# Generated by jkbms2mqtt (dashboard.py) — do not edit by hand.
# naming: legacy  bms-ids: 1,2,3,4,5,6  cells: 1=16,2=16,3=16,4=16,5=16,6=16
# writes: basic=off  safety=off
title: JK-BMS
views:
- title: Overview
  path: overview
  type: sections
  max_columns: 3
  sections:
  - type: grid
    column_span: 3
    cards:
    - type: heading
      heading: Bank summary
      heading_style: title
    - type: grid
      columns: 5
      square: false
      cards:
      - type: custom:mushroom-template-card
        primary: '{{ states(''sensor.jkbms_bank_total_power'') }} W'
        secondary: Total power
        icon: mdi:flash
        icon_color: amber
        entity: sensor.jkbms_bank_total_power
        tap_action:
          action: more-info
      - type: custom:mushroom-template-card
        primary: '{{ states(''sensor.jkbms_bank_total_current'') }} A'
        secondary: Total current
        icon: mdi:current-dc
        icon_color: light-blue
        entity: sensor.jkbms_bank_total_current
        tap_action:
          action: more-info
      - type: custom:mushroom-template-card
        primary: '{{ states(''sensor.jkbms_bank_max_temp'') }} °C'
        secondary: Max temp ({{ state_attr('sensor.jkbms_bank_max_temp', 'bms') }})
        icon: mdi:thermometer
        icon_color: deep-orange
        entity: sensor.jkbms_bank_max_temp
        tap_action:
          action: more-info
      - type: custom:mushroom-template-card
        primary: '{{ states(''sensor.jkbms_bank_min_soc'') }} %'
        secondary: Min SoC ({{ state_attr('sensor.jkbms_bank_min_soc', 'bms') }})
        icon: mdi:battery-low
        icon_color: green
        entity: sensor.jkbms_bank_min_soc
        tap_action:
          action: more-info
      - type: custom:mushroom-template-card
        primary: '{% if is_state(''binary_sensor.jkbms_any_alarm'', ''on'') %}Alarm{% else %}OK{% endif
          %}'
        secondary: Alarms ({{ state_attr('binary_sensor.jkbms_any_alarm', 'bms') }})
        icon: '{% if is_state(''binary_sensor.jkbms_any_alarm'', ''on'') %}mdi:alert{% else %}mdi:shield-check{%
          endif %}'
        icon_color: '{% if is_state(''binary_sensor.jkbms_any_alarm'', ''on'') %}red{% else %}green{%
          endif %}'
        entity: binary_sensor.jkbms_any_alarm
        tap_action:
          action: more-info
  - type: grid
    cards:
    - type: vertical-stack
      cards:
      - type: heading
        heading: BMS 1
        heading_style: title
        icon: mdi:battery
        tap_action:
          action: navigate
          navigation_path: bms-1
      - type: custom:mushroom-template-card
        primary: Last seen
        secondary: '{% if states(''sensor.bms_1_device_last_seen'') in ['''', ''unknown'', ''unavailable'']
          %}Never{% else %}{{ relative_time(as_datetime(states(''sensor.bms_1_device_last_seen''))) }}
          ago{% endif %}'
        icon: mdi:access-point-network
        icon_color: '{% if states(''sensor.bms_1_device_last_seen'') in ['''', ''unknown'', ''unavailable'']
          %}#9e9e9e{% else %}{% set f = ((now() - as_datetime(states(''sensor.bms_1_device_last_seen''))).total_seconds()
          / 300) %}{% set f = [[f, 0] | max, 1] | min %}{{ ''#%02x%02x%02x'' | format((65 + (158 - 65)
          * f) | round | int, (205 + (158 - 205) * f) | round | int, (82 + (158 - 82) * f) | round | int)
          }}{% endif %}'
        entity: sensor.bms_1_device_last_seen
        tap_action:
          action: more-info
      - type: custom:bar-card
        entity: sensor.bms_1_state_of_charge
        name: SoC
        min: 0
        max: 100
        positions:
          icon: 'off'
          indicator: 'off'
        severity:
        - color: '#fa4b54'
          from: 0
          to: 20
        - color: '#ffa600'
          from: 20
          to: 50
        - color: '#41cd52'
          from: 50
          to: 100
      - type: grid
        columns: 3
        square: false
        cards:
        - type: gauge
          entity: sensor.bms_1_total_pack_voltage
          name: Voltage
          min: 40
          max: 60
          needle: true
        - type: gauge
          entity: sensor.bms_1_total_pack_power_signed
          name: Power
          min: -11000
          max: 11000
          needle: true
        - type: gauge
          entity: sensor.bms_1_total_pack_current_negative_discharge
          name: Current
          min: -200
          max: 200
          needle: true
      - type: grid
        columns: 2
        square: false
        cards:
        - type: custom:mushroom-entity-card
          entity: sensor.bms_1_cell_voltage_average
          name: Avg cell
          tap_action:
            action: more-info
          icon_color: light-green
        - type: custom:mushroom-entity-card
          entity: sensor.bms_1_cell_voltage_delta
          name: Delta
          tap_action:
            action: more-info
          icon_color: light-blue
        - type: custom:mushroom-entity-card
          entity: sensor.bms_1_cell_voltage_min_value
          name: Min cell
          tap_action:
            action: more-info
        - type: custom:mushroom-entity-card
          entity: sensor.bms_1_mosfet_temperature
          name: MOS
          tap_action:
            action: more-info
          icon: mdi:thermometer
        - type: custom:mushroom-entity-card
          entity: sensor.bms_1_charge_cycle_count
          name: Cycles
          tap_action:
            action: more-info
          icon: mdi:battery-heart-outline
        - type: custom:mushroom-template-card
          primary: Alarms
          secondary: '{% if states(''sensor.bms_1_comma_separated_list_of_active_alarms'') in ['''', ''unknown'',
            ''unavailable'', ''none'', ''None''] %}None{% else %}{{ states(''sensor.bms_1_comma_separated_list_of_active_alarms'')
            }}{% endif %}'
          icon: '{% if states(''sensor.bms_1_comma_separated_list_of_active_alarms'') in ['''', ''unknown'',
            ''unavailable'', ''none'', ''None''] %}mdi:shield-check{% else %}mdi:alert{% endif %}'
          icon_color: '{% if states(''sensor.bms_1_comma_separated_list_of_active_alarms'') in ['''',
            ''unknown'', ''unavailable'', ''none'', ''None''] %}green{% else %}red{% endif %}'
          entity: sensor.bms_1_comma_separated_list_of_active_alarms
          tap_action:
            action: more-info
    column_span: 1
    visibility:
    - condition: state
      entity: sensor.bms_1_device_last_seen
      state_not: unavailable
    - condition: state
      entity: sensor.bms_1_device_last_seen
      state_not: unknown
