[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "jkbms2mqtt"
version = "1.0.0"
description = "Lightweight JK-BMS to MQTT bridge with Home Assistant Discovery"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "basmeerman" }]
dependencies = [
    "aiomqtt>=2.3.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0",
    "pymodbus[serial]>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "mutmut>=3.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[project.scripts]
jkbms2mqtt = "jkbms2mqtt.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jkbms2mqtt"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    # Asyncio TCP servers occasionally leak a socket during GC; not a code bug.
    "ignore::ResourceWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
branch = true
source = ["src/jkbms2mqtt"]
# dashboard.py is dashboard-generation tooling (Lovelace YAML assembly), not
# core bridge logic. It is validated by the `dashboards` CI job (lint + generate
# + entity-drift check), so it is excluded from the 100% runtime-coverage gate.
omit = ["src/jkbms2mqtt/__main__.py", "src/jkbms2mqtt/dashboard.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 100
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@overload",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",        # pyflakes + pycodestyle
    "I",                  # isort
    "B",                  # bugbear
    "UP",                 # pyupgrade
    "ASYNC",              # async-specific
    "RUF",                # ruff-specific
    "SIM",                # simplify
    "PL",                 # pylint subset
    "TID",                # tidy imports
]
ignore = [
    "PLR0913",            # too many args (we have lots of register definitions)
    "PLR2004",            # magic value in comparison (registers are intentionally hex literals)
    "PLR0911",            # too many return statements (validation flows)
    "RUF001", "RUF002", "RUF003",  # unicode ambiguity (we intentionally use − and ° in docs)
    "UP042",              # str-enum replacement (we want runtime str values for pydantic)
    "SIM105",             # contextlib.suppress vs try/except — micro-stylistic
    "SIM108",             # if/else vs ternary — keep readability
    "PLC0415",            # in-function imports — used to break import cycles
    "RUF046",             # unnecessary cast-to-int — keep round()→int() explicit
    "PLR0912",            # too many branches — fragment-assembly is inherently branchy
    "PLR0915",            # too many statements — see above
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101", "E501", "PLW2901", "E741"]
"src/jkbms2mqtt/protocol/jk_settings.py" = ["E501"]
"src/jkbms2mqtt/entities.py" = ["E501"]
"scripts/build_field_matrix.py" = ["E501", "E701", "B005", "B007"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_unimported = true
pretty = true

# dashboard.py assembles deeply-nested Lovelace card dicts; bare `dict` (i.e.
# dict[str, Any]) is the honest type there. Relax generic-arg strictness for
# this generator module only — the rest of the package stays fully strict.
[[tool.mypy.overrides]]
module = "jkbms2mqtt.dashboard"
disallow_any_generics = false

# mutmut 3.x config (TOML arrays, not the 2.x comma-strings). Test selection is
# the unit + property suites (integration tests aren't useful for mutation and
# are slower); mutmut 3.x runs pytest in-process and is coverage-guided.
[tool.mutmut]
paths_to_mutate = [
    "src/jkbms2mqtt/protocol/",
    "src/jkbms2mqtt/entities.py",
]
# Copy the whole package into the mutants sandbox so sibling modules (app, mqtt,
# config, …) that the tests import resolve — paths_to_mutate alone only copies
# what it mutates, breaking those imports. create_mutants runs after this copy,
# so the mutated protocol/entities files still take precedence.
also_copy = [
    "src/jkbms2mqtt/",
    "scripts/",
]
tests_dir = [
    "tests/unit",
    "tests/property",
]
