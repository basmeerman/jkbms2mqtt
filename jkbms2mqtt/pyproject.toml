[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "jkbms2mqtt"
version = "1.0.0"
description = "Lightweight JK-BMS to MQTT bridge with Home Assistant Discovery"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "basmeerman" }]
dependencies = [
    "aiomqtt>=2.3.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
serial = ["pyserial-asyncio-fast>=0.16"]
can = ["python-can>=4.4"]
all = ["pyserial-asyncio-fast>=0.16", "python-can>=4.4"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "mutmut>=3.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pyserial-asyncio-fast>=0.16",
    "python-can>=4.4",
    "types-PyYAML>=6.0",
]

[project.scripts]
jkbms2mqtt = "jkbms2mqtt.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jkbms2mqtt"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    # Asyncio TCP servers occasionally leak a socket during GC; not a code bug.
    "ignore::ResourceWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
branch = true
source = ["src/jkbms2mqtt"]
omit = ["src/jkbms2mqtt/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 100
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@overload",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",        # pyflakes + pycodestyle
    "I",                  # isort
    "B",                  # bugbear
    "UP",                 # pyupgrade
    "ASYNC",              # async-specific
    "RUF",                # ruff-specific
    "SIM",                # simplify
    "PL",                 # pylint subset
    "TID",                # tidy imports
]
ignore = [
    "PLR0913",            # too many args (we have lots of register definitions)
    "PLR2004",            # magic value in comparison (registers are intentionally hex literals)
    "PLR0911",            # too many return statements (validation flows)
    "RUF001", "RUF002", "RUF003",  # unicode ambiguity (we intentionally use − and ° in docs)
    "UP042",              # str-enum replacement (we want runtime str values for pydantic)
    "SIM105",             # contextlib.suppress vs try/except — micro-stylistic
    "SIM108",             # if/else vs ternary — keep readability
    "PLC0415",            # in-function imports — used to break import cycles
    "RUF046",             # unnecessary cast-to-int — keep round()→int() explicit
    "PLR0912",            # too many branches — fragment-assembly is inherently branchy
    "PLR0915",            # too many statements — see above
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101", "E501", "PLW2901", "E741"]
"src/jkbms2mqtt/registers.py" = ["E501"]
"src/jkbms2mqtt/entities.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_unimported = true
pretty = true

[tool.mutmut]
paths_to_mutate = "src/jkbms2mqtt/protocol/,src/jkbms2mqtt/entities.py"
runner = "python -m pytest -x --no-header -q tests/unit tests/property"
