---
name: jkbms2mqtt
version: "1.0.0"
slug: jkbms2mqtt
description: Lightweight JK-BMS to MQTT bridge with Home Assistant Discovery
url: https://github.com/basmeerman/jkbms2mqtt
# No `image:` field — Home Assistant supervisor builds the add-on locally from
# the Dockerfile in this directory. Per-arch base images come from build.yaml.
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: false
homeassistant: 2025.10.1
hassio_api: true
host_network: false
uart: true  # required for the USB serial transport
services:
  - mqtt:want
map:
  - share:rw
options:
  transport: tcp_gateway
  gateway_host: 192.168.1.100
  gateway_port: 502
  jkbms_count: 1
  topology: master_poll
  poll_interval_s: 3.0
  inter_frame_gap_ms: 50
  mqtt_host: core-mosquitto
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  mqtt_topic_prefix: ""
  discovery_prefix: homeassistant
  enable_basic_writes: false
  enable_safety_writes: false
  log_level: info
  recording:
    enabled: false
    path: /share/jkbms2mqtt/recordings
schema:
  transport: list(tcp_gateway|usb_serial|rtu_listen|can_bus)
  gateway_host: str?
  gateway_port: port?
  jkbms_path: str?
  jkbms_count: int(1,15)
  topology: list(master_poll|broadcast|can)
  poll_interval_s: float(1,30)
  inter_frame_gap_ms: int(10,500)
  mqtt_host: str
  mqtt_port: port
  mqtt_user: str?
  mqtt_password: password?
  mqtt_topic_prefix: str?
  discovery_prefix: str
  enable_basic_writes: bool
  enable_safety_writes: bool
  log_level: list(debug|info|warning|error)
  recording:
    enabled: bool
    path: str
