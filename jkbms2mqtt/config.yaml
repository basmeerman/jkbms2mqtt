---
name: jkbms2mqtt
version: "2.0.1"
slug: jkbms2mqtt
description: JK-BMS to MQTT bridge using the standard RS485 Modbus V1.0 / V1.1 protocol
url: https://github.com/basmeerman/jkbms2mqtt
# No `image:` field — Home Assistant supervisor builds locally from the
# Dockerfile in this directory. Per-arch base images come from build.yaml.
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: false
homeassistant: 2025.10.1
hassio_api: true
host_network: false
uart: true  # required when the USB serial transport is selected
services:
  - mqtt:want
map:
  - share:rw

# Every option below has a default. None are nullable / optional — that's
# what suppresses the "Show unused optional configuration options" toggle in
# the HA Configuration tab.
options:
  transport: tcp_gateway
  gateway_host: 192.168.1.100
  gateway_port: 502
  jkbms_path: /dev/ttyUSB0
  bms_ids: "1"
  topology: master_poll
  poll_interval_s: 5.0
  mqtt_host: core-mosquitto.local.hass.io
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  discovery_prefix: homeassistant
  bms_name_prefix: BMS
  enable_basic_writes: false
  enable_safety_writes: false
  debug_unverified_fields: false
  log_level: info
  recording_enabled: false

schema:
  transport: list(tcp_gateway|usb_serial)
  gateway_host: str
  gateway_port: port
  jkbms_path: str
  # Comma-separated list of slave IDs in 1..15. The regex permits whitespace
  # around commas so "1, 2, 3" works.
  bms_ids: match(^\s*\d+(\s*,\s*\d+)*\s*$)
  topology: list(master_poll)
  poll_interval_s: float(1,60)
  mqtt_host: str
  mqtt_port: port
  mqtt_user: str
  mqtt_password: password
  discovery_prefix: str
  bms_name_prefix: str
  enable_basic_writes: bool
  enable_safety_writes: bool
  debug_unverified_fields: bool
  log_level: list(debug|info|warning|error)
  recording_enabled: bool
